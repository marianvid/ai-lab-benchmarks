# Type checking for the harness, run by the reviewer in the `ai-lab` environment.
#
# That environment holds only Python and the test tools. The libraries below
# belong to the engines and evaluators the scripts drive; each is installed only
# in that engine's own environment, so mypy cannot see it here. Each is named
# on its own, so an import of anything not on this list is still reported.
[mypy]

# Tensors, audio and models.
[mypy-torch.*,torchaudio.*,torchmetrics.*,transformers.*,numpy.*,soundfile.*,librosa.*]
ignore_missing_imports = True

# Speech: the TTS engines, diarization and Whisper on the Mac.
[mypy-qwen_tts.*,omnivoice.*,fireredtts3.*,chatterbox.*,dia2.*,fish_speech.*,ormsgpack.*,pyannote.*,mlx_whisper.*]
ignore_missing_imports = True

# Sound effects.
[mypy-stable_audio_3.*,tangoflux.*]
ignore_missing_imports = True

# Images and video: OCR fixtures, face tracking, and the two video models'
# own sources, which their runners put on the path at run time.
[mypy-PIL.*,cv2.*,insightface.*,mmgp.*,infer_preview.*,talking_avatar.*]
ignore_missing_imports = True

# Datasets and scoring.
[mypy-pyarrow.*,sacrebleu.*]
ignore_missing_imports = True

# Process and HTTP helpers that ship without type information.
[mypy-psutil.*,requests.*]
ignore_missing_imports = True
