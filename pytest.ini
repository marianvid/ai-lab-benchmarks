[pytest]
pythonpath = .
testpaths = tests
# Coverage floor: the figure measured on 2026-10-18 (54 %, the tests themselves
# left out by .coveragerc), in the manager's
# `ai-lab` environment, where the scripts that need an engine's libraries are
# skipped. It only goes up; the target is 80 %.
addopts = --cov=harness --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=54
